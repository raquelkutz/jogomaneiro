  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HQ.updateStreak();

      const name = localStorage.getItem('userName') || '';
      const isNewUser = sessionStorage.getItem('newUser') === 'true';
      if (isNewUser && (name === '' || name === 'Aventureiro')) {
        showNameModal();
      }
    });

    function showNameModal() {
      const overlay = document.createElement('div');
      overlay.className = 'name-modal-overlay';
      overlay.innerHTML = `
        <div class="name-modal">
          <div class="name-washi"></div>
          <h2>✨ BEM-VINDO!</h2>
          <p>Como você quer ser chamado?</p>
          <input type="text" id="nameInput" maxlength="24" placeholder="Seu nome de aventureiro..." autofocus>
          <button onclick="saveUserName()">COMEÇAR!</button>
        </div>
      `;
      document.body.appendChild(overlay);

      setTimeout(() => document.getElementById('nameInput').focus(), 100);

      document.getElementById('nameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveUserName();
      });
    }

    function saveUserName() {
      const input = document.getElementById('nameInput');
      const name = input.value.trim() || 'Aventureiro';
      localStorage.setItem('userName', name);
      // Atualiza também no banco de usuários
      const email = localStorage.getItem('userEmail');
      if (email) {
        try {
          const users = JSON.parse(localStorage.getItem('hq_users') || '{}');
          const key = email.toLowerCase().trim();
          if (users[key]) {
            users[key].name = name;
            localStorage.setItem('hq_users', JSON.stringify(users));
          }
        } catch {}
      }
      sessionStorage.removeItem('newUser');
      document.querySelector('.name-modal-overlay').remove();
    }
  </script>

    /* Tape decoration for profile panel */

      background: rgba(241, 201, 122, 0.7);
      transform: rotate(3deg);
      box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }
  </style>

    </nav>
  </div>

  <script>
    function mostrarAvisoJornada(msg) {
      let toast = document.getElementById('jornada-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'jornada-toast';
        toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff9d2;color:#333;padding:12px 20px;border-radius:12px;border:2px dashed #9dd4a0;box-shadow:0 4px 15px rgba(0,0,0,0.18);font-family:"Cabin Sketch",cursive;font-size:17px;letter-spacing:1px;z-index:999;text-align:center;max-width:85%;transition:opacity 0.3s ease;pointer-events:none;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        if (toast) toast.style.opacity = '0';
      }, 4000);
    }

    /**
     * Inicia a Jornada:
     * 1. No PC com servidor ativo: abre o Jogo Audrey nativo desktop via API.
     * 2. Se for em ambiente web puro ou offline: redireciona para jogo.html.
     */
    async function iniciarJornada() {
      if (window.SFX) SFX.journey();
      const btn = document.getElementById('btn-iniciar-jornada');
      if (btn) {
        btn.style.transform = 'scale(0.95)';
        btn.style.opacity   = '0.8';
      }

      try {
        const res = await fetch('/api/iniciar-jogo', { method: 'POST' });
        const data = await res.json();
        if (data && data.success) {
          mostrarAvisoJornada('✨ Jogo Audrey aberto no PC! Seus pontos e missões estão sincronizados.');
          setTimeout(() => {
            if (btn) {
              btn.style.transform = '';
              btn.style.opacity = '';
            }
          }, 600);
          return;
        }
      } catch (e) {
        console.log('Modo web fallback:', e);
      }

      // Fallback para tela web
      setTimeout(() => { window.location.href = 'jogo.html'; }, 400);
    }
  </script>
</body>
</html>
