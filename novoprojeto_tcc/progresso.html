<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>if (!sessionStorage.getItem('loggedIn')) { window.location.href = 'index.html'; }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hobby Quest - Desempenho</title>
  <link rel="stylesheet" href="style.css">
  <script src="xp-system.js"></script>
  <script src="sound-effects.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Caveat:wght@400;700&family=Walter+Turncoat&display=swap" rel="stylesheet">
  <style>
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    @keyframes barGrow {
      from { width: 0%; }
    }

    .progress-container {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      position: relative;
      padding: 24px 20px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: clip;
      animation: fadeSlideUp 0.6s ease-out;
    }

    /* Header */
    .progress-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      z-index: 2;
      animation: fadeSlideUp 0.5s ease-out;
    }

    .progress-header h1 {
      font-family: 'Cabin Sketch', cursive;
      font-size: 36px;
      color: #222;
      letter-spacing: 2px;
      margin: 0;
    }

    .progress-header svg {
      animation: float 3s ease-in-out infinite;
    }

    /* NEW PROGRESS STYLES */
    .overview-sticky {
      background: #fdf5c9;
      width: 90%;
      padding: 20px;
      border-radius: 2px 15px 2px 15px;
      box-shadow: 3px 4px 10px rgba(0,0,0,0.1);
      position: relative;
      margin-bottom: 30px;
      transform: rotate(-1deg);
      border: 1px solid #e8db9b;
      z-index: 5;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out 0.1s forwards;
    }
    .overview-sticky::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 25px;
      background: rgba(255,192,203,0.6); /* pink tape */
      box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      z-index: 1;
      animation: shimmer 2s ease-in-out infinite;
    }
    .overview-title {
      font-family: 'Cabin Sketch', cursive;
      font-size: 26px;
      color: #444;
      text-align: center;
      margin: 0 0 15px 0;
      border-bottom: 2px dashed #d4c88c;
      padding-bottom: 8px;
    }
    .stats-row {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-box .val {
      font-family: 'Walter Turncoat', cursive;
      font-size: 32px;
      color: #e07a5f;
    }
    .stat-box .lbl {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      color: #666;
    }

    /* Progress Bars Section */
    .progress-section {
      width: 90%;
      background: rgba(255,255,255,0.6);
      border: 2px dashed #b8c8d8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      z-index: 5;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out 0.2s forwards;
    }
    .progress-section-title {
      font-family: 'Cabin Sketch', cursive;
      font-size: 24px;
      color: #3b5998;
      text-align: center;
      margin: 0 0 20px 0;
    }
    .hobby-bar-container {
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out forwards;
    }
    .hobby-bar-container:nth-child(2) { animation-delay: 0.25s; }
    .hobby-bar-container:nth-child(3) { animation-delay: 0.35s; }
    .hobby-bar-container:nth-child(4) { animation-delay: 0.45s; }
    .bar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 1s ease-in-out;
      animation: barGrow 1.2s ease-out forwards;
    }
    .hobby-bar-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .hobby-bar-name {
      font-family: 'Walter Turncoat', cursive;
      font-size: 16px;
      color: #444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hobby-bar-level {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      color: #777;
    }
    .bar-bg {
      width: 100%;
      height: 18px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ccc;
    }
    .fill-leitura { background: repeating-linear-gradient(45deg, #7cc0d8, #7cc0d8 10px, #5aa0b8 10px, #5aa0b8 20px); width: 0%; }
    .fill-arte { background: repeating-linear-gradient(45deg, #e68ab4, #e68ab4 10px, #c66a94 10px, #c66a94 20px); width: 0%; }
    .fill-fitness { background: repeating-linear-gradient(45deg, #f0a07c, #f0a07c 10px, #d0805c 10px, #d0805c 20px); width: 0%; }

    /* Action Grid */
    .action-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 90%;
      margin-bottom: 30px;
      z-index: 5;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out 0.5s forwards;
    }
    .action-card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
      text-decoration: none;
      display: block;
    }
    .action-card:hover {
      transform: scale(1.05) rotate(2deg);
    }
    .action-card::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 5px;
    }
    .action-card.desafios { border: 2px solid #9dd4a0; }
    .action-card.niveis { border: 2px solid #f1c97a; }
    .action-card h3 {
      font-family: 'Walter Turncoat', cursive;
      font-size: 16px;
      margin: 10px 0 5px;
      color: #333;
    }
    .action-card p {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      color: #777;
      margin: 0;
    }

    /* Reset button updated */
    .reset-btn {
      background: #ffe5e5;
      border: 2px dashed #ff6b6b;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out 0.6s forwards;
    }
    .reset-btn:hover {
      background: #ffcccc;
      transform: rotate(-2deg);
    }
    .reset-btn span {
      font-family: 'Walter Turncoat', cursive;
      font-size: 18px;
      color: #d93838;
    }



    /* ===== PROFILE OVERLAY ===== */
    .profile-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .profile-overlay.active { opacity: 1; pointer-events: all; }
    .profile-panel { width: 100%; max-width: 480px; max-height: 88vh; background-color: var(--bg-color); background-image: repeating-linear-gradient(transparent, transparent 39px, var(--line-color) 39px, var(--line-color) 40px); border-radius: 28px 28px 0 0; padding: 16px 24px 36px; overflow-y: auto; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 -8px 40px rgba(0,0,0,0.2); }
    .profile-overlay.active .profile-panel { transform: translateY(0); }
    .profile-handle { width: 45px; height: 5px; background: #c4c4c4; border-radius: 100px; margin: 0 auto 20px; }
    .profile-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; }
    .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #a88bc5 0%, #c06dd8 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(168,139,197,0.5); position: relative; }
    .profile-avatar svg { fill: white; stroke: none; }
    .profile-hero-title { font-family: 'Cabin Sketch', cursive; font-size: 32px; color: #333; letter-spacing: 2px; margin: 0; }
    .profile-hero-sub { font-family: 'Caveat', cursive; font-size: 18px; color: #888; margin: 0; }
    .profile-info-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; width: 100%; }
    .profile-info-card { background-color: #f1c97a; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; padding: 14px 22px; display: flex; align-items: center; gap: 14px; box-shadow: inset 0 0 5px rgba(0,0,0,0.08), 2px 3px 0 rgba(0,0,0,0.05); }
    .profile-info-card svg { flex-shrink: 0; opacity: 0.7; }
    .profile-info-card .info-content { display: flex; flex-direction: column; }
    .profile-info-card .info-label { font-family: 'Walter Turncoat', cursive; font-size: 12px; color: #997a3e; letter-spacing: 1px; text-transform: uppercase; }
    .profile-info-card .info-value { font-family: 'Cabin Sketch', cursive; font-size: 20px; color: var(--primary-green); letter-spacing: 1px; }
    .profile-stats { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; width: 100%; }
    .stat-badge { background: #e5d9c5; border-radius: 14px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; box-shadow: 1px 2px 4px rgba(0,0,0,0.08); }
    .stat-badge .stat-number { font-family: 'Cabin Sketch', cursive; font-size: 26px; color: var(--primary-green); }
    .stat-badge .stat-label { font-family: 'Walter Turncoat', cursive; font-size: 11px; color: #777; text-align: center; }
    .profile-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; width: 100%; }
    .profile-action-card { background-color: #9dd4a0; border-radius: 16px; padding: 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 2px 3px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; text-decoration: none; }
    .profile-action-card:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 3px 5px 14px rgba(0,0,0,0.16); }
    .profile-action-card:active { transform: scale(0.96); }
    .profile-action-card.achievements { background-color: #fce28b; }
    .profile-action-card.story { background-color: #a8d8ea; }
    .profile-action-card .action-icon { font-size: 32px; }
    .profile-action-card .action-title { font-family: 'Cabin Sketch', cursive; font-size: 16px; color: #333; text-align: center; letter-spacing: 1px; }
    .profile-action-card .action-desc { font-family: 'Walter Turncoat', cursive; font-size: 12px; color: #555; text-align: center; }
    .profile-logout-btn { width: 100%; background: transparent; border: 2px dashed #e07a5f; border-radius: 16px; padding: 14px 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
    .profile-logout-btn:hover { background-color: rgba(224,122,95,0.08); border-color: #d95940; transform: scale(1.02); }
    .profile-logout-btn:active { transform: scale(0.97); }
    .profile-logout-btn span { font-family: 'Cabin Sketch', cursive; font-size: 20px; color: #e07a5f; letter-spacing: 2px; }
    .profile-logout-btn svg { stroke: #e07a5f; }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 10px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 10;
      padding: 5px;
    }
    .back-btn svg { stroke: #6b5baf; }
  </style>
</head>
<body>
  <div class="progress-container">

    <!-- Header -->
    <div class="progress-header">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#6b5baf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="30" width="8" height="15"/>
        <rect x="17" y="22" width="8" height="23"/>
        <rect x="29" y="12" width="8" height="33"/>
        <path d="M9 30l12-8 12-10"/>
      </svg>
      <h1>DESEMPENHO</h1>
    </div>

    <!-- Overview Sticky Note -->
    <div class="overview-sticky">
      <h2 class="overview-title">Resumo Geral</h2>
      <div class="stats-row">
        <div class="stat-box">
          <span class="val">1,240</span>
          <span class="lbl">Total XP</span>
        </div>
        <div class="stat-box">
          <span class="val">12</span>
          <span class="lbl">Desafios</span>
        </div>
        <div class="stat-box">
          <span class="val">0</span>
          <span class="lbl">Dias Seguidos</span>
        </div>
      </div>
    </div>

    <!-- Progress Bars -->
    <div class="progress-section">
      <h2 class="progress-section-title">Meus Hobbies</h2>
      
      <!-- Leitura -->
      <div class="hobby-bar-container">
        <div class="hobby-bar-header">
          <span class="hobby-bar-name">📖 Leitura</span>
          <span class="hobby-bar-level" id="level-leitura">Nível 1</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill fill-leitura" id="bar-leitura"></div>
        </div>
      </div>

      <!-- Arte -->
      <div class="hobby-bar-container">
        <div class="hobby-bar-header">
          <span class="hobby-bar-name">🎨 Arte</span>
          <span class="hobby-bar-level" id="level-arte">Nível 1</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill fill-arte" id="bar-arte"></div>
        </div>
      </div>

      <!-- Fitness -->
      <div class="hobby-bar-container">
        <div class="hobby-bar-header">
          <span class="hobby-bar-name">🏋️ Fitness</span>
          <span class="hobby-bar-level" id="level-fitness">Nível 1</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill fill-fitness" id="bar-fitness"></div>
        </div>
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="action-cards">
      <a href="conquistas.html" class="action-card desafios" style="grid-column: 1 / -1; min-height: 130px;" onclick="event.preventDefault(); if(window.SFX)SFX.achievement(); setTimeout(function(){window.location.href='conquistas.html'},400)">
        <svg width="40" height="40" viewBox="0 0 60 60" fill="none" stroke="#f1c97a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto; display:block;">
          <circle cx="30" cy="30" r="22" stroke-dasharray="8 4"/>
          <polygon points="30,12 35,25 48,25 38,33 41,46 30,38 19,46 22,33 12,25 25,25" fill="none"/>
          <circle cx="30" cy="30" r="4" fill="#f1c97a"/>
        </svg>
        <h3>Conquistas</h3>
        <p>Medalhas e Troféus</p>
      </a>
    </div>

    <!-- Reset Button -->
    <button class="reset-btn" id="resetAllBtn">
      <span>♻️ Reiniciar progresso</span>
    </button>

    

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <!-- Casa -->
      <a class="nav-item" href="home.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10L12 3l9 7v10a1 1 0 01-1 1H4a1 1 0 01-1-1V10z"/>
          <path d="M9 21V13h6v8"/>
        </svg>
        <span>HOME</span>
      </a>
      <!-- Meta -->
      <a class="nav-item" href="meta.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="2"/>
          <path d="M12 2v2M12 20v2"/>
        </svg>
        <span>OBJETIVOS</span>
      </a>
      <!-- Progresso (active) -->
      <a class="nav-item active" href="progresso.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="14" width="4" height="7"/>
          <rect x="10" y="9" width="4" height="12"/>
          <rect x="17" y="4" width="4" height="17"/>
          <path d="M5 14l7-5 7-5"/>
        </svg>
        <span>DESEMPENHO</span>
      </a>
      <!-- Ajuda -->
      <a class="nav-item" href="ajuda.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
          <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
        </svg>
        <span>AJUDA</span>
      </a>
      <!-- Perfil -->
      <a class="nav-item" href="perfil.html" id="profileNavBtn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="5"/>
          <path d="M3 21c0-4.97 4.03-9 9-9s9 4.03 9 9"/>
        </svg>
        <span>PERFIL</span>
      </a>
    </nav>
  <script>
    function formatNumber(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function updateAllDisplays() {
      // Barras de hobby
      ['leitura', 'arte', 'fitness'].forEach(hobby => {
        const xp  = HQ.getXP(hobby);
        const pct = HQ.getXPPercent(hobby);
        const level = HQ.getLevel(hobby);
        const bar = document.getElementById('bar-' + hobby);
        const lvl = document.getElementById('level-' + hobby);
        if (bar) bar.style.width = pct + '%';
        if (lvl) lvl.textContent = 'Nível ' + level;
      });

      // Total XP, desafios e dias seguidos (resumo)
      const valEls = document.querySelectorAll('.overview-sticky .stats-row .stat-box .val');
      if (valEls[0]) valEls[0].textContent = formatNumber(HQ.getTotalXP());
      if (valEls[1]) valEls[1].textContent = HQ.getCompletedCheckins();
      if (valEls[2]) valEls[2].textContent = HQ.getStreak();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Atualiza/garante streak correto no carregamento
      HQ.updateStreak();
      updateAllDisplays();
    });

    // Atualiza ao voltar de outra aba
    window.addEventListener('storage', (e) => {
      if (e.key && (e.key.startsWith('xp_') || e.key === 'checkin_states' || e.key === 'hq_streak')) {
        updateAllDisplays();
      }
    });

    // Atualiza em tempo real na mesma aba
    window.addEventListener('hq:xpUpdated', updateAllDisplays);

    // Reset all progress
    document.getElementById('resetAllBtn').addEventListener('click', () => {
      if (!confirm('Tem certeza? Isso vai apagar todo o seu progresso (XP, metas e conquistas).')) return;
      HQ.resetAll();
      updateAllDisplays();
      const btn = document.getElementById('resetAllBtn').querySelector('span');
      btn.textContent = '✅ Progresso reiniciado!';
      setTimeout(() => { btn.textContent = '♻️ Reiniciar progresso'; }, 2500);
    });
  </script>

  </div>
</body>
</html>
