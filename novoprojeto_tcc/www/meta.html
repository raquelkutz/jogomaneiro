<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>if (!sessionStorage.getItem('loggedIn')) { window.location.href = 'index.html'; }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hobby Quest - Objetivos</title>
  <link rel="stylesheet" href="style.css">
  <script src="xp-system.js"></script>
  <script src="sound-effects.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Caveat:wght@400;700&family=Walter+Turncoat&display=swap" rel="stylesheet">
  <style>
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.8); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0)       scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      to   { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.8); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== LEVEL UP MODAL ===== */
    @keyframes levelUpIn {
      0%   { opacity: 0; transform: scale(0.5) rotate(-8deg); }
      70%  { transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes starSpin {
      from { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.3); }
      to   { transform: rotate(360deg) scale(1); }
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80px) rotate(360deg); opacity: 0; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .levelup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .levelup-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .levelup-card {
      width: 100%;
      max-width: 360px;
      background: #fdf5c9;
      background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(0,0,0,0.05) 27px, rgba(0,0,0,0.05) 28px);
      border-radius: 8px 8px 8px 8px;
      padding: 32px 28px 28px;
      box-shadow: 4px 6px 24px rgba(0,0,0,0.25), 0 0 0 3px #f0e08a;
      position: relative;
      text-align: center;
      animation: levelUpIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center center;
    }

    /* Washi tape top */
    .levelup-card::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 80px;
      height: 26px;
      background: rgba(168,216,234,0.75);
      box-shadow: 1px 1px 3px rgba(0,0,0,0.12);
    }

    /* Confetti pieces */
    .levelup-confetti {
      position: absolute;
      top: 10px;
      width: 100%;
      left: 0;
      pointer-events: none;
      overflow: hidden;
      height: 80px;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFall 1.4s ease-in forwards;
    }

    .levelup-star {
      font-size: 54px;
      display: block;
      margin: 10px auto 6px;
      animation: starSpin 1.2s ease-out forwards, bounce 1.5s 1.2s ease-in-out infinite;
      line-height: 1;
    }

    .levelup-congrats {
      font-family: 'Cabin Sketch', cursive;
      font-size: 30px;
      color: #e07a5f;
      letter-spacing: 2px;
      margin: 8px 0 4px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.06);
    }

    .levelup-subtitle {
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: #555;
      margin: 0 0 6px;
    }

    .levelup-hobby {
      font-family: 'Cabin Sketch', cursive;
      font-size: 26px;
      letter-spacing: 1px;
      margin: 0 0 16px;
    }

    .levelup-badge {
      display: inline-block;
      background: #fff;
      border: 3px dashed #e07a5f;
      border-radius: 50px;
      padding: 8px 28px;
      margin-bottom: 24px;
      box-shadow: 2px 3px 0 rgba(0,0,0,0.08);
    }
    .levelup-badge span {
      font-family: 'Walter Turncoat', cursive;
      font-size: 22px;
      color: #333;
    }
    .levelup-badge strong {
      font-family: 'Cabin Sketch', cursive;
      font-size: 28px;
      color: #e07a5f;
    }

    .levelup-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .levelup-btn {
      width: 100%;
      border: none;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      padding: 16px 20px;
      cursor: pointer;
      font-family: 'Cabin Sketch', cursive;
      font-size: 18px;
      letter-spacing: 1px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 2px 3px 8px rgba(0,0,0,0.12);
    }
    .levelup-btn:hover  { transform: scale(1.03) rotate(-0.5deg); box-shadow: 3px 5px 14px rgba(0,0,0,0.18); }
    .levelup-btn:active { transform: scale(0.97); }

    .btn-story {
      background: linear-gradient(135deg, #a8d8ea 0%, #7ec8e3 100%);
      color: #1a5e78;
      border: 2px dashed rgba(30,120,160,0.25);
    }
    .btn-home {
      background: linear-gradient(135deg, #c7f0d8 0%, #9dd4a0 100%);
      color: #1a6633;
      border: 2px dashed rgba(30,130,70,0.2);
    }

    body {
      background-color: #faeebb;
      background-image: repeating-linear-gradient(transparent, transparent 39px, var(--line-color) 39px, var(--line-color) 40px);
      background-attachment: fixed;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
    }
    .meta-container {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      position: relative;
      padding: 24px 20px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: clip;
      animation: fadeSlideUp 0.6s ease-out;
    }

    /* Header */
    .meta-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      z-index: 2;
      background: rgba(255,255,255,0.7);
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 2px dashed #e07a5f;
      animation: fadeSlideUp 0.5s ease-out;
    }

    .meta-header h1 {
      font-family: 'Cabin Sketch', cursive;
      font-size: 38px;
      color: #222;
      letter-spacing: 2px;
      margin: 0;
    }

    .target-icon {
      flex-shrink: 0;
    }

    /* Dashed separator */
    .dashed-sep {
      width: 100%;
      border: none;
      border-top: 4px dashed #ccc;
      margin: 16px 0;
      z-index: 2;
    }

    /* Category block */
    .category-block {
      width: 100%;
      z-index: 2;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.4);
      padding: 15px;
      border-radius: 20px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out forwards;
    }
    .category-block:nth-child(2) { animation-delay: 0.15s; }
    .category-block:nth-child(3) { animation-delay: 0.3s; }
    .category-block:nth-child(4) { animation-delay: 0.45s; }

    .category-title {
      width: 100%;
      background-color: #a88bc5;
      border-radius: 25px;
      padding: 10px 20px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    
    .category-title.leitura { background-color: #5b8a72; }
    .category-title.arte { background-color: #f1a0c4; }
    .category-title.fitness { background-color: #d35400; }

    .category-title h2 {
      font-family: 'Cabin Sketch', cursive;
      font-size: 24px;
      color: #fff;
      letter-spacing: 1px;
      margin: 0;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .task-item {
      display: flex;
      align-items: center;
      background-color: #fff;
      border-radius: 15px;
      padding: 12px 15px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.08);
      gap: 12px;
      transition: transform 0.2s, opacity 0.3s;
      border: 2px dashed transparent;
    }
    
    .task-item:hover {
      transform: translateX(2px);
    }

    .task-item.completed {
      opacity: 0.6;
      background-color: #f0f0f0;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #888;
    }

    .custom-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #555;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #fff;
      transition: all 0.2s;
    }

    .task-item.completed .custom-checkbox {
      background: #9dd4a0;
      border-color: #9dd4a0;
    }

    .task-item.completed .custom-checkbox::after {
      content: '✓';
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .task-text {
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: #333;
      flex-grow: 1;
      margin: 0;
      line-height: 1.2;
    }

    .xp-badge {
      font-family: 'Walter Turncoat', cursive;
      font-size: 13px;
      color: #fff;
      background: #a88bc5;
      border-radius: 20px;
      padding: 3px 9px;
      white-space: nowrap;
      flex-shrink: 0;
      opacity: 0.9;
      transition: background 0.3s;
    }

    .task-item.completed .xp-badge {
      background: #9dd4a0;
      color: #fff;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 20px;
      padding: 0 5px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    
    .delete-btn:hover {
      opacity: 1;
    }

    /* Add Task Area */
    .add-task-container {
      display: flex;
      gap: 8px;
    }

    .add-task-input {
      flex-grow: 1;
      background: #fff;
      border: 2px dashed #ccc;
      border-radius: 15px;
      padding: 10px 15px;
      font-family: 'Caveat', cursive;
      font-size: 18px;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-task-input:focus {
      border-color: #a88bc5;
    }

    .add-task-btn {
      background: #a88bc5;
      color: white;
      border: none;
      border-radius: 15px;
      width: 44px;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }

    .reset-task-btn {
      background: white;
      color: #d35400;
      border: 2px solid #d35400;
      border-radius: 15px;
      width: 44px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.08);
      transition: transform 0.1s, background-color 0.2s;
    }
    .reset-task-btn:hover {
      background: #ffece3;
    }
    .reset-task-btn:active {
      transform: scale(0.95);
    }

    .add-task-btn:active {
      transform: scale(0.95);
    }
    
    .category-block[data-category="leitura"] .add-task-btn { background: #5b8a72; }
    .category-block[data-category="arte"] .add-task-btn { background: #f1a0c4; }
    .category-block[data-category="fitness"] .add-task-btn { background: #d35400; }

    .category-block[data-category="leitura"] .reset-task-btn { border-color: #5b8a72; color: #5b8a72; }
    .category-block[data-category="leitura"] .reset-task-btn:hover { background: #e8f0ec; }
    .category-block[data-category="arte"] .reset-task-btn { border-color: #f1a0c4; color: #f1a0c4; }
    .category-block[data-category="arte"] .reset-task-btn:hover { background: #fdf0f5; }

    /* Profile Overlay Styles */
    .profile-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .profile-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .profile-panel {
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      background-color: var(--bg-color);
      background-image: repeating-linear-gradient(transparent, transparent 39px, var(--line-color) 39px, var(--line-color) 40px);
      border-radius: 28px 28px 0 0;
      padding: 16px 24px 36px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
    }

    .profile-overlay.active .profile-panel {
      transform: translateY(0);
    }

    .profile-handle {
      width: 45px;
      height: 5px;
      background: #c4c4c4;
      border-radius: 100px;
      margin: 0 auto 20px;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-radius: 12px;
      background: #f0f0f0;
      font-family: 'Walter Turncoat', cursive;
    }

    .stat-number {
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-align: center;
    }

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .profile-action-card:active {
      transform: scale(0.95);
    }

    .action-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .action-title {
      font-family: 'Cabin Sketch', cursive;
      font-size: 16px;
      color: #333;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .action-desc {
      font-family: 'Caveat', cursive;
      font-size: 13px;
      color: #666;
    }

    .profile-logout-btn {
      width: 100%;
      padding: 12px;
      border: 2px dashed #ff4757;
      border-radius: 16px;
      background: #fff0f0;
      font-family: 'Cabin Sketch', cursive;
      font-size: 14px;
      color: #ff4757;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .profile-logout-btn:hover {
      background: #ffe0e0;
    }

    .profile-logout-btn:active {
      transform: scale(0.95);
    }


    .back-btn {
      position: absolute;
      top: 20px;
      left: 10px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 10;
      padding: 5px;
    }
    .back-btn svg { stroke: #e07a5f; }
  </style>
</head>
<body>
  <div class="meta-container">

    <div class="meta-header">
      <svg class="target-icon" width="40" height="40" viewBox="0 0 50 50" fill="none">
        <circle cx="25" cy="25" r="20" stroke="#e07a5f" stroke-width="3" fill="none"/>
        <circle cx="25" cy="25" r="13" stroke="#e07a5f" stroke-width="3" fill="none"/>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

  <script>
    // Default tasks if local storage is empty
    // Calcula o XP de uma tarefa com base no número de palavras
    function calcTaskXP(text) {
      const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
      return Math.max(20, Math.min(100, words * 15));
    }

    const defaultTasks = {
      leitura: [
        { id: 1, text: "Ler livro do armário", completed: false, xp: calcTaskXP("Ler livro do armário") }
      ],
      arte: [
        { id: 2, text: "Recriar com seus traços uma obra de arte famosa", completed: false, xp: calcTaskXP("Recriar com seus traços uma obra de arte famosa") }
      ],
      fitness: [
        { id: 3, text: "Faça 12 polichinelos", completed: false, xp: calcTaskXP("Faça 12 polichinelos") }
      ]
    };

    const legacyTasks = {
      leitura: "Ler 5 páginas de um livro",
      arte: "Fazer um desenho de si mesmo",
      fitness: "Faça um aquecimento de 10 minutos"
    };

    function loadStoredTasks() {
      const stored = localStorage.getItem(HQ._k('hobbyQuestTasks'));
      if (!stored) return null;
      try {
        return JSON.parse(stored);
      } catch {
        return null;
      }
    }

    function isLegacyTaskSet(storedTasks) {
      if (!storedTasks) return false;
      return Object.keys(legacyTasks).every(cat => {
        const item = (storedTasks[cat] || [])[0];
        return item && item.text === legacyTasks[cat] && item.completed === false && (storedTasks[cat].length === 1);
      });
    }

    function isEmptyTasks(storedTasks) {
      if (!storedTasks) return true;
      return ['leitura', 'arte', 'fitness'].every(cat => !(storedTasks[cat] || []).length);
    }

    let tasks = loadStoredTasks();
    if (!tasks || isEmptyTasks(tasks) || isLegacyTaskSet(tasks)) {
      tasks = defaultTasks;
      localStorage.setItem(HQ._k('hobbyQuestTasks'), JSON.stringify(tasks));
    }

    // Retroativamente preenche o campo xp em tarefas que não o têm (compatibilidade)
    ['leitura', 'arte', 'fitness'].forEach(cat => {
      (tasks[cat] || []).forEach(t => {
        if (t.xp === undefined) t.xp = calcTaskXP(t.text);
      });
    });

    function saveTasks() {
      localStorage.setItem(HQ._k('hobbyQuestTasks'), JSON.stringify(tasks));
      renderAllTasks();
    }

    function renderTasks(category) {
      const listContainer = document.getElementById(`list-${category}`);
      listContainer.innerHTML = '';

      tasks[category].forEach(task => {
        const taskXP = task.xp || calcTaskXP(task.text);
        const taskItem = document.createElement('div');
        taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        taskItem.innerHTML = `
          <div class="custom-checkbox" onclick="toggleTask('${category}', ${task.id})"></div>
          <p class="task-text">${task.text}</p>
          <span class="xp-badge">${task.completed ? '✓' : '+' + taskXP} XP</span>
          <button class="delete-btn" onclick="deleteTask('${category}', ${task.id})">✖</button>
        `;
        
        listContainer.appendChild(taskItem);
      });
    }

    function renderAllTasks() {
      renderTasks('leitura');
      renderTasks('arte');
      renderTasks('fitness');
    }

    function toggleTask(category, id) {
      const task = tasks[category].find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        const xpAmount = task.xp || calcTaskXP(task.text);

        if (task.completed) {
          HQ.addXP(category, xpAmount, 'Meta Concluída');
          if (window.SFX) SFX.success();
        } else {
          HQ.removeXP(category, xpAmount);
        }
        saveTasks();
      }
    }

    function deleteTask(category, id) {
      // O XP já foi adicionado/modificado no localStorage e não recalculamos mais retroativamente do zero na inicialização
      tasks[category] = tasks[category].filter(t => t.id !== id);
      saveTasks();
    }

    function addTask(category) {
      const input = document.getElementById(`input-${category}`);
      const text = input.value.trim();
      
      if (text) {
        const xp = calcTaskXP(text);
        const newTask = {
          id: Date.now(),
          text: text,
          completed: false,
          xp: xp
        };
        
        tasks[category].push(newTask);
        input.value = '';
        saveTasks();
      }
    }

    // Allow Enter key to add task
    ['leitura', 'arte', 'fitness'].forEach(category => {
      const input = document.getElementById(`input-${category}`);
      input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          addTask(category);
        }
      });
    });

    // Initial render
    renderAllTasks();

    // Function to reset level of any category
    function resetLevel(category) {
      if (tasks[category] && Array.isArray(tasks[category])) {
        tasks[category].forEach(t => t.completed = false);
      }
      HQ.setXP(category, 0);
      saveTasks();
      console.log(category + ' level resetado com sucesso!');
    }

    // Make function available globally
    window.resetLevel = resetLevel;
  </script>
</body>
</html>
